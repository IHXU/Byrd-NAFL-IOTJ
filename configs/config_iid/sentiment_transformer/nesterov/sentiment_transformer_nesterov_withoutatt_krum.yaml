experiment:
  name: sentiment_transformer_nesterov_withoutatt_krum_iid
  seed: 42
  log_level: INFO
  save_path: results/iid/sentiment_transformer_nesterov_withoutatt_krum_iid
dataset:
  batch_size: 32
  train:
    class_path: fl_framework.data.datasets.Sentiment140Dataset
    params:
      data_file: data_cache/sentiment140/training.1600000.processed.noemoticon.csv
      train: true
      max_len: 128
      vocab_file: data_cache/sentiment140/vocab.pt
      tokenizer_type: simple
  test:
    class_path: fl_framework.data.datasets.Sentiment140Dataset
    params:
      data_file: data_cache/sentiment140/testdata.manual.2009.06.14.csv
      train: false
      max_len: 128
      vocab_file: data_cache/sentiment140/vocab.pt
      tokenizer_type: simple
  partition:
    iid: true
    seed: 42
model:
  class_path: fl_framework.components.models.sentiment_transformer.SentimentTransformer
  params:
    vocab_size: 30002
    d_model: 256
    nhead: 4
    num_layers: 2
    num_classes: 2
training:
  rounds: 100
  round_steps: 60
  train_loss_function:
    class_path: torch.nn.CrossEntropyLoss
  test_loss_function:
    class_path: torch.nn.CrossEntropyLoss
  metrics:
  - class_path: fl_framework.utils.metrics.TopKAccuracy
    params:
      k: 1
optimizer:
  class_path: fl_framework.components.optimizers.sgd-nesterov.SGDNesterov
  params:
    lr: 0.005
    momentum: 0.85
    weight_decay: 0.005
aggregator:
  class_path: fl_framework.components.aggregators.krum.KrumAggregator
  params:
    num_byzantine: 0
honest:
  num_clients: 12
byzantine:
  num_clients: 0
  attack: null
